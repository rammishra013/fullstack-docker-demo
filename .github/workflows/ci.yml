name: Full-Stack CI Pipeline

# Step 5: Configure workflow triggers
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-and-docker:
    name: Lint, Test, Build & Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # Step 6: Install dependencies
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      # Step 8: Run linting
      - name: Run ESLint
        working-directory: ./backend
        run: npm run lint

      # Step 7: Run tests
      - name: Run unit tests
        working-directory: ./backend
        env:
          NODE_ENV: test
        run: npm test

      # Step 9: Build the application
      - name: Build application
        working-directory: ./backend
        run: npm run build

      # Step 10: Build Docker images
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: rammishra013/sample-backend:ci-${{ github.sha }}

      - name: Build Frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: rammishra013/sample-frontend:ci-${{ github.sha }}

